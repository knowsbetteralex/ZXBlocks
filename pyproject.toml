[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zxblocks"
version = "0.1.0"
description = "Visual-programming compiler targeting the ZX Spectrum 48K"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "ZXBlocks contributors"}]
dependencies = []

[project.scripts]
zxblocks = "zxblocks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
